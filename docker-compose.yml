# Iran Carbon Black — On-Premise AI Platform (Phase 1 Infrastructure)
# Domains: Energy, Supply Chain, Quality, Sales, Finance, Integration, Demand

services:
  # ─── Data layer ───────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: icb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - icb-net

  redis:
    image: redis:7-alpine
    container_name: icb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icb-net

  minio:
    image: minio/minio:latest
    container_name: icb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - icb-net

  minio-init:
    image: minio/mc:latest
    container_name: icb-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_RAW} || true;
      mc mb -p local/$${MINIO_BUCKET_CURATED} || true;
      mc mb -p local/$${MINIO_BUCKET_MODELS} || true;
      mc anonymous set download local/$${MINIO_BUCKET_CURATED} || true;
      echo 'MinIO buckets ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_CURATED: ${MINIO_BUCKET_CURATED}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
    networks:
      - icb-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: icb-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - icb-net

  # ─── Observability ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: icb-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - icb-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: icb-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres
    networks:
      - icb-net

  # ─── Online Dashboard (SPA) ───────────────────────────────
  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: icb-dashboard
    restart: unless-stopped
    networks:
      - icb-net

  # ─── API Gateway ──────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: icb-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - dashboard
      - auth
      - ingestion
      - energy
      - supply
      - quality
      - sales
      - finance
      - demand
      - integration
      - training
      - ops
      - maturity
    networks:
      - icb-net

  # ─── Microservices ────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: auth
        SERVICE_PORT: "8001"
    container_name: icb-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: auth
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icb-net

  ingestion:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ingestion
        SERVICE_PORT: "8002"
    container_name: icb-ingestion
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: ingestion
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - icb-net

  energy:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: energy
        SERVICE_PORT: "8003"
    container_name: icb-energy
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: energy
      SERVICE_PORT: 8003
      DOMAIN: energy
    volumes:
      - ./models/energy:/app/models/energy
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - icb-net

  supply:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: supply
        SERVICE_PORT: "8004"
    container_name: icb-supply
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: supply
      SERVICE_PORT: 8004
      DOMAIN: supply
    volumes:
      - ./models/supply:/app/models/supply
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  quality:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: quality
        SERVICE_PORT: "8005"
    container_name: icb-quality
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: quality
      SERVICE_PORT: 8005
      DOMAIN: quality
    volumes:
      - ./models/quality:/app/models/quality
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  sales:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: sales
        SERVICE_PORT: "8006"
    container_name: icb-sales
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: sales
      SERVICE_PORT: 8006
      DOMAIN: sales
    volumes:
      - ./models/sales:/app/models/sales
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  finance:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: finance
        SERVICE_PORT: "8007"
    container_name: icb-finance
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: finance
      SERVICE_PORT: 8007
      DOMAIN: finance
    volumes:
      - ./models/finance:/app/models/finance
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  integration:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: integration
        SERVICE_PORT: "8009"
    container_name: icb-integration
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: integration
      SERVICE_PORT: 8009
      DOMAIN: integration
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  training:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: training
        SERVICE_PORT: "8010"
    container_name: icb-training
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: training
      SERVICE_PORT: 8010
      DOMAIN: training
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  ops:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: ops
        SERVICE_PORT: "8011"
    container_name: icb-ops
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: ops
      SERVICE_PORT: 8011
      DOMAIN: ops
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - icb-net

  maturity:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: maturity
        SERVICE_PORT: "8012"
    container_name: icb-maturity
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: maturity
      SERVICE_PORT: 8012
      DOMAIN: maturity
    volumes:
      - ./models:/app/models
    ports:
      - "8012:8012"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - icb-net

  demand:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_NAME: demand
        SERVICE_PORT: "8008"
    container_name: icb-demand
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: demand
      SERVICE_PORT: 8008
      DOMAIN: demand
    volumes:
      - ./models/demand:/app/models/demand
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - icb-net

  # Phase 1: OT edge simulator (pilot sensors + energy meters)
  edge-simulator:
    build:
      context: .
      dockerfile: scripts/Dockerfile.edge
    container_name: icb-edge-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      EDGE_INTERVAL_SEC: "10"
    depends_on:
      - mosquitto
      - ingestion
    networks:
      - icb-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:

networks:
  icb-net:
    driver: bridge
    name: icb-net
