# OT network hints — keep broker on OT VLAN; disable anonymous in true prod with password_file
listener 1883
protocol mqtt
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# Optional websocket for IT dashboards only (prefer firewalling 9001 from OT)
listener 9001
protocol websockets
allow_anonymous true
