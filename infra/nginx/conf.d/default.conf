upstream auth_upstream { server auth:8001; }
upstream ingestion_upstream { server ingestion:8002; }
upstream energy_upstream { server energy:8003; }
upstream supply_upstream { server supply:8004; }
upstream quality_upstream { server quality:8005; }
upstream sales_upstream { server sales:8006; }
upstream finance_upstream { server finance:8007; }
upstream demand_upstream { server demand:8008; }
upstream integration_upstream { server integration:8009; }
upstream training_upstream { server training:8010; }
upstream ops_upstream { server ops:8011; }
upstream maturity_upstream { server maturity:8012; }
upstream dashboard_upstream { server dashboard:80; }

server {
    listen 80;
    server_name _;

    # Security headers (Phase 4)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /api/v1/auth/ {
        proxy_pass http://auth_upstream/api/v1/auth/;
    }

    location /api/v1/ingestion/ {
        proxy_buffering off;
        proxy_pass http://ingestion_upstream/api/v1/ingestion/;
    }

    location /api/v1/energy/ {
        proxy_pass http://energy_upstream/api/v1/energy/;
    }

    location /api/v1/supply/ {
        proxy_pass http://supply_upstream/api/v1/supply/;
    }

    location /api/v1/quality/ {
        proxy_buffering off;
        proxy_pass http://quality_upstream/api/v1/quality/;
    }

    location /api/v1/sales/ {
        proxy_pass http://sales_upstream/api/v1/sales/;
    }

    location /api/v1/finance/ {
        proxy_pass http://finance_upstream/api/v1/finance/;
    }

    location /api/v1/demand/ {
        proxy_pass http://demand_upstream/api/v1/demand/;
    }

    location /api/v1/erp/ {
        proxy_pass http://integration_upstream/api/v1/erp/;
    }

    location /api/v1/training/ {
        proxy_pass http://training_upstream/api/v1/training/;
    }

    location /api/v1/ops/ {
        proxy_pass http://ops_upstream/api/v1/ops/;
    }

    location /api/v1/maturity/ {
        proxy_pass http://maturity_upstream/api/v1/maturity/;
    }

    location /docs/auth { proxy_pass http://auth_upstream/docs; }
    location /docs/energy { proxy_pass http://energy_upstream/docs; }
    location /docs/demand { proxy_pass http://demand_upstream/docs; }
    location /docs/finance { proxy_pass http://finance_upstream/docs; }
    location /docs/erp { proxy_pass http://integration_upstream/docs; }
    location /docs/ops { proxy_pass http://ops_upstream/docs; }
    location /docs/maturity { proxy_pass http://maturity_upstream/docs; }

    # Online executive dashboard (SPA)
    location / {
        proxy_pass http://dashboard_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
